<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arqueiro da Arquitetura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>
<main>
<h1>Arqueiro da Arquitetura</h1>
<div class="sign"><small id="rn">PISTA</small><p id="ct">Prepare o arco…</p></div>
<div id="wrap">
<canvas id="c" width="800" height="450"></canvas>
<div id="ov"><div class="box" id="bx"></div></div>
</div>
<section id="craft" hidden>
<div class="table">
<div class="tl"><div id="cg"></div><div class="out"><span>&rarr;</span><div id="res" class="slot res"></div></div></div>
<ol id="cl"></ol>
</div>
<div class="inv" id="inv"></div>
<div class="bar"><button id="cb">Craftar</button><button id="cc">Limpar mesa</button><span id="cmsg"></span></div>
</section>
<p class="hint">A mira fica no centro: mova o mouse (ou o dedo) para olhar ao redor, segure para puxar a corda e solte para atirar. No fim, monte o computador na mesa de trabalho.</p>
</main>
<script src="script.js"></script>

</body>
</html>
